name: Community leaderboard

on:
  issues:
    # `opened` is the authoritative event for a new submission; the paired
    # `labeled` event (issue forms attach the label at creation) carries
    # created_at == updated_at and is skipped below so only one run builds.
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - leaderboard.py
      - submissions/**
      - .github/workflows/community-leaderboard.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: community-leaderboard
  # Never cancel for issue events: the paired `labeled` duplicate of an
  # `opened` run is gated by the job `if` below, and with cancel-in-progress
  # true a duplicate (or any concurrent push) can cancel the real build
  # mid-deploy. Issue builds queue instead.
  cancel-in-progress: ${{ github.event_name != 'issues' }}

jobs:
  build:
    # Skip the duplicate `labeled` event emitted when an issue form creates an
    # already-labeled issue (created_at == updated_at at that moment).
    if: >-
      github.event_name != 'issues' ||
      !(github.event.action == 'labeled' &&
        github.event.issue.created_at == github.event.issue.updated_at)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch every open issue (not label-filtered) and let the renderer decide
      # what is a submission: label-filtered listings can lag behind an edit,
      # and a just-created issue must never be missing from its own build.
      - name: Fetch open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json number,title,body,url,author,createdAt,updatedAt,labels,state \
            > "$RUNNER_TEMP/issues.json"

      - name: Build leaderboard
        run: |
          python3 leaderboard.py site \
            --issues "$RUNNER_TEMP/issues.json" \
            --output docs \
            --errors "$RUNNER_TEMP/invalid-submissions.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # deploy-pages cannot reliably see an artifact finalized moments earlier in
  # the SAME job ("Found 0 artifact(s)" with a green upload step;
  # actions/deploy-pages#451). A separate job reads the artifact after the
  # build job has closed, which is the supported pattern.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
