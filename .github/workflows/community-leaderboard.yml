name: Community leaderboard

on:
  issues:
    # `opened` is the authoritative event for a new submission; the paired
    # `labeled` event (issue forms attach the label at creation) carries
    # created_at == updated_at and is skipped below so only one run builds.
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - leaderboard.py
      - submissions/**
      - .github/workflows/community-leaderboard.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: community-leaderboard
  # A skipped job still cancels an in-progress run in its group before the job
  # `if` is applied. The paired `labeled` event of an issue form must therefore
  # never cancel the `opened` run it duplicates.
  cancel-in-progress: >-
    ${{
      github.event_name != 'issues'
      || github.event.action != 'labeled'
      || github.event.issue.created_at != github.event.issue.updated_at
    }}

jobs:
  build:
    # Skip the duplicate `labeled` event emitted when an issue form creates an
    # already-labeled issue (created_at == updated_at at that moment).
    if: >-
      github.event_name != 'issues' ||
      !(github.event.action == 'labeled' &&
        github.event.issue.created_at == github.event.issue.updated_at)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fetch every open issue (not label-filtered) and let the renderer decide
      # what is a submission: label-filtered listings can lag behind an edit,
      # and a just-created issue must never be missing from its own build.
      - name: Fetch open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 1000 \
            --json number,title,body,url,author,createdAt,updatedAt,labels,state \
            > "$RUNNER_TEMP/issues.json"

      - name: Build leaderboard
        run: |
          python3 leaderboard.py site \
            --issues "$RUNNER_TEMP/issues.json" \
            --output docs \
            --errors "$RUNNER_TEMP/invalid-submissions.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
